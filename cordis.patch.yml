# dsh-session-delete bundle patch: inserts the Host row into the profile's
# plugin roster. The browser half rides this package's `dsh.client` manifest.
# The bundle patch is applied automatically on install, so do NOT insert this
# row again in the profile patch (duplicate ids crash the loader).
- insert:
    - id: dsh-session-delete
      name: 'dsh-session-delete'
